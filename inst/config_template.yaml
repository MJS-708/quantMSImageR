# ============================================================
# quantMSImageR - DESI-MRM study config
# Run:  quantMSImageR::runStudy("path/to/this.yaml")
# ============================================================

study: "my_study_name"                  # fallback report filename prefix

# ============================= PATHS =============================
paths:
  data_path:    "path/to/study/raw"        # .raw acquisition folders
  out_path:     "path/to/study/results"    # report + xlsx output
  image_dir:    "path/to/study/images"     # per-feature txt images
  lib_ion_path: "path/to/ion_library.csv"  # MRM ion-library CSV

# ============================ SAMPLES ============================
# One entry per sample. pos:/neg: = .raw name(s); run_id unique; group = the
# comparison. `block:` is optional -- a SECOND factor (patient, donor, sex,
# slide) shared by several samples; see parameters$block_name below.
samples:

  # One acquisition.
  - neg: "acq_run_ctrl_neg"             # pos: and/or neg: (string or list)
    run_id: "S1"                        # unique per sample
    block:  "P1"                        # optional second factor; omit when there is none
    group:  "Ctrl"                      # the comparison (shared across replicates)

  # Several panels over the SAME area -- neg + pos, or pos01 + pos02.
  # Merged pixel by pixel (bindPanels).
  - neg: "acq_run_trt_neg"
    pos: ["acq_run_trt_pos01", "acq_run_trt_pos02"]
    run_id: "S2"
    block:  "P1"                        # same patient as S1: a pair, not two groups
    group:  "Treatment"

  # One tissue acquired in PIECES, e.g. a top and a bottom. Panels are merged
  # within each piece, then the pieces are placed where the stage recorded
  # them and joined into one sample (stitchAcquisitions). Two halves of one
  # tissue are one sample, not two replicates.
  - run_id: "S3"
    group:  "Treatment"
    pieces:
      - neg: "acq_run_trt2_top_neg"
        pos: ["acq_run_trt2_top_pos01", "acq_run_trt2_top_pos02"]
      - neg: "acq_run_trt2_btm_neg"
        pos: ["acq_run_trt2_btm_pos01", "acq_run_trt2_btm_pos02"]

# ==================== PROCESSING PARAMETERS ====================
parameters:
  snr_thresh:     [1.2, 3]              # global SNR sweep (one report each) | 0 = raw, no mask
  snr_overrides:                        # per-analyte fixed SNR (else global) | omit
    #"PGE2":     5                      # display or ion-library names
    #"12-HETE":  1.2
  heatmap_row_split: "Met-1"            # ion-library column to split heatmap columns | omit
  heatmap_style:  "auto"                # auto = contribution when a group has 3+ reps AND every region has 3+ rows
                                        #   (the z-score is taken within a region, so a region of two
                                        #    saturates whatever the data says) | per_sample | contribution
  heatmap_scale:  "both"                # contribution heatmap only: shared = features comparable | feature = each on its own scale | both = one section per quantile showing each
  heatmap_quantiles: [0.25, 0.5, 0.75, 0.95, 0.98]   # pixel quantiles to draw a heatmap section for; fewer = shorter report
  thresh:         20                    # cold-spot percentile removed
  perc:           99                    # hot-spot percentile suppressed in the txt images
                                        #   (these feed other software, so they keep their range;
                                        #    output$ion_images$percentile caps the report images)
  rot_clockwise:  0                     # image rotation: 0/1/2/3 x 90 deg
  average_method: "median"              # background summary: mean | median

  # Internal-standard normalisation.
  type_header:    "Type"                # ion-library column holding the feature type (E.g., Analyte and Internal standard)
  is_name:        "None"                # ion-library Type value, e.g. "IS" | None = skip
  is_norm_header: "None"                # None | ion-library column naming each analyte's IS. only when is_name matches >1 feature
  is_mode:        "line"                # summarise IS per: line | window | sample | pixel
  is_window:      15                    # n consecutive pixels when is_mode: window
  remove_IS:      True                  # drop the IS features after normalising
  baseline_group: "Ctrl"                # group used as fold-change denominator
  block_name:     "Patient"             # what block: means in this study, for the
                                        #   sample map and the image panel titles
  block_centre:   off                   # correct each block for its own level:
                                        #   off      = annotate only, every value untouched
                                        #   center   = divide each block by its OWN geometric mean
                                        #   baseline = divide by the block's baseline_group arm, so
                                        #              a cell reads as fold change vs its own control
                                        #   Multiplicative, so a block's gain goes and the size of
                                        #   its response stays. Reaches the heatmaps and the
                                        #   comparison plots; the ion images are never corrected.
                                        #   When on, the filename gains a "blocked" token.
  stitch_overlap: "error"               # pieces of one tissue that claim the same position:
                                        #   error (default) | first | last -- keep that piece

# =========================== COLOURS ===========================
# Palettes used in the HTML report. See quantPalettes() for the hex values.
#   viridis   sequential, perceptually uniform, colour-blind safe
#   heatmap0  sequential, dark blue -> teal -> sand -> red (9 colours)
#   heatmap2  diverging,  blue -> white -> red (5 colours)
#   hat       qualitative, 10 well-separated hues
#   reading   qualitative, 8 softer hues
#
# To SEE them, in R:
#   names(quantPalettes())                       # the package's own
#   scales::show_col(quantPalettes("hat"))       # draw one
#   grDevices::hcl.pals("qualitative")           # the rest, for region:
#   scales::show_col(grDevices::hcl.colors(6, "Dark 3"))
# and https://colorspace.r-forge.r-project.org/articles/hcl_palettes.html
# shows every grDevices palette side by side.
colours:
  ion_image: "heatmap0"                 # ion images:        heatmap0 | viridis
  heatmap:   "heatmap2"                 # z-score heatmap:   heatmap2 | heatmap0
  group:     "hat"                      # sample-group bar:  hat | reading | heatmap0
  feature:   "reading"                  # feature-class bar: reading | hat | heatmap0
  region:    "Set 2"                    # regions of interest (maps + box plots): any palette above, or a
                                        # grDevices qualitative one -- hcl.pals("qualitative") lists them
  cell_border: "white"                  # line between heatmap cells: colour | "none"

# ====================== FEATURE CONTROL ======================
features:
  exclude: None                         # None | list e.g. ["CUDA [M-H]-", "EKODE"]

  rename:                               # display-name overrides (ion-library name -> new)
    enabled: False                      # False = keep original names
    #"8-isoPGE2 || PGE2": "PGE2"

# ============================== ROIs ==============================
# Regions drawn with labelROIs(), one roi_labels.csv per acquisition.
roi:
  enabled:            auto              # auto (on when any acquisition has roi_labels.csv) | True | False
  include_unassigned: False             # tissue outside every region as its own "unassigned" type | leave out
  compare:            "between_groups"  # between_groups: airway Ctrl v HDM, vessel Ctrl v HDM
                                        # between_rois:   Ctrl airway v vessel, HDM airway v vessel
                                        # both:           both sets of plots
  heatmap:            True              # extra heatmap section: one row per sample and region, each region z-scored against itself | False
  unit:               "sample"          # what one point/row is, in every region view:
                                        #   sample = one per sample per region type (a sample's airways pooled)
                                        #   roi    = one per region (airway_01, airway_02, ...)

# ========================= CALIBRATION =========================
# Quantification from on-slide / on-tissue standards
calibration:
  enabled: False                        # False = skip; set True once cal data is ready
  cal_acquisition: "cal_run_name"       # .raw name of the standards acquisition (in data_path)
  cal_roi_csv:     "path/to/cal_ROIs.csv"              # pixel -> sample_type="Cal" + identifier
  cal_metadata:    "path/to/calibration_metadata.csv"  # identifier,analyte,amount_pg,level
  cal_type:        "std_addition"       # REQUIRED: std_addition (on-tissue) | cal (on-slide)
  weighting:       "1/x"                # regression weights: 1/x | 1/x2 | none
  val_slot:        "intensity"          # slot to calibrate
  background_level: "background"        # 'level' value used as the std-addition blank
  quantify_pixels: ["tissue_pixels"]    # pixel label(s) in the study to quantify
  max_out_of_range: 0.1                 # stop if >this fraction extrapolated | 1 = allow any

# ========================= ION RATIOS =========================
ratios:                                 # pixel-wise numerator / denominator images
  enabled: False                        # False = skip ratios
  entries:
    - num:   "PGE2"
      den:   "AA"
      label: "PGE2 --- AA"

# =========================== OUTPUTS ===========================
output:
  fig_dpi:       300                    # figure resolution; 300 = publication floor
  render_report: True                   # build HTML report
  output_txt:    False                  # write per-feature txt images
  output_ratios: False                  # write ratio txt images (needs ratios.enabled)
  ion_gif:                              # animation of the ion images, at the top of that section
    enabled:  True                      # one frame per feature, all sections at once, in pathway order
    features: "all"                     # "all", or a list: ["PGE2", "AA"]
    seconds:  0.4                       # how long each frame is shown (quick: it is an overview)
  ion_images:                           # display settings shared by EVERY image in the report
    percentile:   95                    # colour scale capped here -- the animation, the dropdown's
                                        #   first rendering and the concentration images alike; each
                                        #   caption states the value it used. Separate from
                                        #   parameters$perc, which caps the .txt images.
    scale_within: "block"               # which panels SHARE a colour scale:
                                        #   all   = one scale for the whole study (the default, and
                                        #           Cardinal's image() rendering, unchanged)
                                        #   block = one scale per patient/sex/slide. Each block
                                        #           becomes a column, its groups the rows, replicates
                                        #           across the row, and each column states its own cap
                                        #   group = one scale per group instead
                                        #   Needs block: on the samples; ignored without one.
    scale:        "suppress"            # not yet read: suppress = linear, capped at percentile
                                        #   histogram = enhance each panel | sqrt
  colocalisation: auto                  # pixel colocalisation, ONE level only (slowest section in the report):
                                        #   auto   = within the regions when the study has them, else off
                                        #            (and always off when a sample merges acquisitions)
                                        #   'roi'  = within each region type -- fewer pixels, so quicker
                                        #   'sample' (or True) = all pixels of each sample
                                        #   False  = not computed
