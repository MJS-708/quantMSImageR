# ============================================================
# quantMSImageR — DESI-MRM study config
# Run:  CONFIG_FILE <- "path/to/this.yaml"
#       source(system.file("run_study.R", package = "quantMSImageR"))
# ============================================================

study: "my_study_name"                 # fallback report filename prefix

# ============================= PATHS =============================
paths:
  data_path:    "D:/__STUDIES/my_study/data/DESI-MRM/raw"   # .raw acquisition folders
  out_path:     "D:/__STUDIES/my_study/results/DESI-MRM"    # report + xlsx output
  image_dir:    "D:/__STUDIES/my_study/data/DESI-MRM/images"  # per-feature txt images
  lib_ion_path: "D:/__STUDIES/ion_library.csv"             # MRM ion-library CSV

# ============================ SAMPLES ============================
# one entry per sample (heatmap order). pos:/neg: = .raw name(s), no .raw suffix.
# multiple .raw per polarity are combined; run_id unique; label = group.
samples:
  - neg: "acq_run_ctrl_neg"            # pos: and/or neg: (string or list)
    run_id: "S1"                       # unique per sample
    label:  "Ctrl"                     # group (shared across replicates)

  - pos:                               # multiple acquisitions -> combined
      - "acq_run_trt_pos_rep1"
      - "acq_run_trt_pos_rep2"
    run_id: "S2"
    label:  "Treatment"

# ==================== PROCESSING PARAMETERS ====================
parameters:
  snr_thresh:     [1.2, 3]             # global SNR sweep (one report each) | 0 = raw, no mask
  snr_overrides:                       # per-analyte fixed SNR (else global) | omit
    #"PGE2":     5                     # display or ion-library names
    #"12-HETE":  1.2
  heatmap_row_split: "Met-1"           # ion-library column to split heatmap rows | omit
  tiss_fc:        0.6                  # S/N threshold for tissue fold-change layer
  thresh:         20                   # cold-spot percentile removed
  perc:           97                   # hot-spot percentile suppressed
  rot_clockwise:  0                    # image rotation: 0/1/2/3 x 90 deg
  average_method: "median"             # noise summary: mean | median
  baseline_label: "Ctrl"              # group used as fold-change denominator

# ====================== FEATURE CONTROL ======================
features:
  exclude: None                        # None | list e.g. ["CUDA [M-H]-", "EKODE"]

  rename:                              # display-name overrides (ion-library name -> new)
    enabled: False                     # False = keep original names
    #"8-isoPGE2 || PGE2": "PGE2"

# ========================= ION RATIOS =========================
ratios:                                # pixel-wise numerator / denominator images
  enabled: False                       # False = skip ratios
  entries:
    - num:   "PGE2"
      den:   "AA"
      label: "PGE2 --- AA"

# ========================= CALIBRATION =========================
# Absolute quantification from on-slide / on-tissue standards. When enabled,
# builds a response-vs-amount curve per lipid and converts tissue-pixel
# intensities to pg/pixel and pg/mm2. Writes <report_fn>_calibrated.RDS.
calibration:
  enabled: False                       # False = skip calibration
  cal_acquisition: "cal_run_slide1"    # .raw name of the standards acquisition
  cal_roi_csv:     "D:/.../cal_ROIs.csv"              # pixel -> sample_type="Cal" + identifier
  cal_metadata:    "D:/.../calibration_metadata.csv"  # identifier,lipid,amount_pg,level
  cal_type:        "std_addition"      # std_addition (on-tissue) | cal (on-slide)
  val_slot:        "intensity"         # slot to calibrate
  background_level: "background"       # 'level' value used as the std-addition blank
  quantify_pixels: ["tissue_pixels"]   # pixel label(s) in the study to quantify

# =========================== OUTPUTS ===========================
output:
  render_report: true                  # build HTML report
  output_txt:    false                 # write per-feature txt images
  output_ratios: false                 # write ratio txt images (needs ratios.execute)
